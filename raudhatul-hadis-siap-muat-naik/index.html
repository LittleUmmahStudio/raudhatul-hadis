<!DOCTYPE html>
<html lang="ms" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF9F0">
<title>Raudhatul Hadis SK Lotong Tambunan</title>
<link rel="icon" type="image/png" href="gambar/laman/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --krim:#FFF9F0;
  --mint:#DDF3E4;
  --langit:#DDF1FF;
  --kuning:#FFE79A;
  --coral:#FFB6A0;
  --hijau:#214E43;
  --hijau-sederhana:#2F6F5E;
  --kelabu:#4A6A60;
  --garis:#CFE7D8;
  --kuning-lembut:#FFF4CC;
  --coral-lembut:#FFE9E2;
  --bayang:0 8px 24px rgba(33,78,67,.10);
  /* nama lama, dikekalkan supaya kod lain tidak rosak */
  --zamrud-tua:var(--hijau);--zamrud:var(--hijau-sederhana);--zamrud-muda:var(--mint);
  --emas:var(--coral);--emas-tua:#8A4429;--emas-muda:var(--kuning);--kertas:#fff;--tinta:var(--hijau);
  --arab:'Amiri','Noto Naskh Arabic','Scheherazade New','Traditional Arabic',serif;
  --judul:'Nunito','Segoe UI',system-ui,sans-serif;
  --badan:'Nunito','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--krim);color:var(--hijau);font-family:var(--badan);font-size:1.0625rem;line-height:1.7;-webkit-text-size-adjust:100%}
img{max-width:100%}
a{color:var(--hijau-sederhana)}
:focus-visible{outline:3px solid var(--hijau);outline-offset:3px;border-radius:8px}
.lapis{max-width:1120px;margin:0 auto;padding:0 22px}
.arab{font-family:var(--arab);direction:rtl;text-align:right;line-height:2.2}

/* ---------- header ---------- */
header.nav{position:sticky;top:0;z-index:20;background:rgba(255,249,240,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px solid var(--mint);box-shadow:0 4px 18px rgba(33,78,67,.06)}
.nav .lapis{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;position:relative}
.jenama{display:flex;align-items:center;text-decoration:none;flex:none}
.jenama img{display:block;height:44px;width:auto}
.jenama .logo-ikon{display:none}
nav.menu{display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{color:var(--hijau);text-decoration:none;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;font-weight:800;font-size:1rem}
nav.menu a:hover{background:var(--mint)}
nav.menu a[aria-current="page"]{background:var(--hijau);color:var(--krim)}
.butang-menu{display:none;background:#fff;border:2px solid var(--hijau);color:var(--hijau);border-radius:999px;padding:8px 20px;min-height:46px;font:inherit;font-weight:800;cursor:pointer}
@media(max-width:980px){
  .butang-menu{display:block}
  nav.menu{display:none;position:absolute;left:12px;right:12px;top:calc(100% + 8px);background:#fff;padding:10px;flex-direction:column;border-radius:24px;box-shadow:0 14px 34px rgba(33,78,67,.18);gap:2px}
  nav.menu.buka{display:flex}
  nav.menu a{min-height:50px;padding:10px 18px;font-size:1.05rem}
}
@media(max-width:700px){.jenama img{height:38px}.nav .lapis{min-height:64px}}
@media(max-width:359px){.jenama .logo-penuh{display:none}.jenama .logo-ikon{display:block;height:40px}}

/* ---------- butang ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;background:var(--hijau);color:var(--krim);font-weight:800;text-decoration:none;padding:12px 26px;border-radius:999px;border:0;font-family:inherit;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 14px rgba(33,78,67,.22);line-height:1.2;text-align:center}
.btn:hover{background:#2d6556}
.btn.gelap{background:var(--hijau);color:var(--krim)}
.btn.kuning{background:var(--kuning);color:var(--hijau);box-shadow:0 6px 14px rgba(180,140,0,.2)}
.btn.kuning:hover{background:#ffdd78}
.btn.tepi,.btn.senyap{background:transparent;color:var(--hijau);border:2px solid var(--hijau);box-shadow:none}
.btn.tepi:hover,.btn.senyap:hover{background:var(--mint)}
.btn.kecil{min-height:46px;padding:9px 20px;font-size:1rem}

/* ---------- hero ---------- */
.hero-taman{background:var(--krim);overflow:hidden;border-radius:0 0 44px 44px}
.hero-bingkai{position:relative;max-width:1600px;margin:0 auto;height:clamp(470px,46vw,680px);display:flex;align-items:center}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right 58%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%);mask-image:linear-gradient(90deg,transparent 0,#000 14%)}
.hero-isi{position:relative;z-index:1;width:100%}
.hero-teks{max-width:min(480px,40%)}
.hero-teks h1{font-family:var(--judul);font-weight:900;font-size:clamp(2rem,3.7vw,3.2rem);line-height:1.12;margin:0 0 .45em;color:var(--hijau)}
.hero-teks .lead{font-size:1.15rem;margin:0 0 26px;color:var(--hijau)}
@media(max-width:899px){
  .hero-bingkai{display:block;height:auto}
  .hero-img{position:static;height:clamp(270px,74vw,440px);object-position:72% 45%;-webkit-mask-image:none;mask-image:none;border-radius:0 0 38px 38px}
  .hero-isi{padding:0}
  .hero-teks{max-width:none;margin:-46px 16px 20px;background:#fff;border-radius:28px;padding:26px 24px 28px;box-shadow:var(--bayang);position:relative}
}

/* ---------- bahagian ---------- */
section.bhg{padding:60px 0}
section.bhg.mint,section.bhg.langit,section.bhg.putih{margin:0 12px;border-radius:40px}
section.bhg.mint,section.bhg.putih{background:var(--mint)}
section.bhg.langit{background:var(--langit)}
section.bhg.naik{padding:0 0 18px;margin-top:-40px;position:relative;z-index:2}
@media(max-width:899px){section.bhg.naik{margin-top:6px}section.bhg{padding:44px 0}}
h2.tajuk{font-family:var(--judul);font-weight:900;font-size:clamp(1.65rem,3.6vw,2.35rem);line-height:1.2;margin:0 0 .3em;color:var(--hijau)}
p.sub{color:var(--kelabu);max-width:44em;margin:0 0 28px;font-size:1.05rem}
.tajuk-hiasan{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tajuk-hiasan svg{flex:none}

/* kad hadis bulan ini */
.kad-bulan{background:#fff;color:var(--hijau);border-radius:30px;padding:26px 28px;border:3px solid var(--kuning);box-shadow:var(--bayang);display:flex;gap:24px;align-items:center}
.kad-bulan .isi{flex:1}
.kad-bulan .label{display:inline-block;font-weight:800;color:var(--hijau);font-size:.95rem;background:var(--coral);border-radius:999px;padding:3px 14px}
.kad-bulan h2{font-family:var(--judul);font-weight:900;font-size:1.65rem;line-height:1.2;margin:.35em 0 .3em;color:var(--hijau)}
.kad-bulan p{margin:.3em 0 1em;color:var(--kelabu);font-size:1.02rem}
.kad-bulan .kod{display:inline-block;background:var(--mint);color:var(--hijau);font-weight:800;border-radius:8px;padding:2px 10px;font-size:.95rem}
.lencana-no{flex:none;width:92px;height:92px;border-radius:50%;background:var(--kuning);display:grid;place-items:center;font-family:var(--judul);font-weight:900;font-size:2.6rem;color:var(--hijau);box-shadow:inset 0 0 0 5px #fff,0 0 0 3px var(--coral)}
@media(max-width:640px){.kad-bulan{flex-direction:column;align-items:flex-start;padding:22px}.lencana-no{width:76px;height:76px;font-size:2.1rem}}

/* ---------- taman 42 hadis ---------- */
.taman{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 6px;margin:22px 0}
.bintang{position:relative;aspect-ratio:1;display:grid;place-items:center;text-decoration:none;border:0;cursor:pointer;background:none;padding:0;font-family:inherit;min-height:60px}
.bintang::before{content:"";position:absolute;inset:0;background:var(--garis);clip-path:polygon(50% 0,61% 20%,85% 15%,80% 39%,100% 50%,80% 61%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 61%,0 50%,20% 39%,15% 15%,39% 20%);transition:transform .2s}
.bintang::after{content:"";position:absolute;inset:4px;background:#fff;clip-path:polygon(50% 0,61% 20%,85% 15%,80% 39%,100% 50%,80% 61%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 61%,0 50%,20% 39%,15% 15%,39% 20%)}
.bintang span{position:relative;z-index:1;font-family:var(--judul);font-weight:900;font-size:1.4rem;color:#55776c}
.bintang:hover::before{transform:scale(1.08) rotate(6deg)}
.bintang.done::before{background:var(--kuning)}
.bintang.done::after{background:var(--hijau)}
.bintang.done span{color:var(--kuning)}
.bintang.now::before{background:var(--coral);animation:denyut 2.4s ease-in-out infinite}
.bintang.now::after{background:var(--kuning)}
.bintang.now span{color:var(--hijau)}
.bintang.plan::before{background:var(--kuning)}
.bintang.plan::after{background:#fff}
.bintang.plan span{color:var(--hijau)}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.bintang.now::before{animation:none}html{scroll-behavior:auto}}
.legenda{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:1rem;color:var(--kelabu)}
.legenda i{display:inline-block;width:18px;height:18px;border-radius:6px;vertical-align:-3px;margin-right:7px;border:2px solid var(--kuning)}
.legenda .d{background:var(--hijau)}.legenda .n{background:var(--coral);border-color:var(--coral)}.legenda .p{background:#fff}.legenda .k{background:#fff;border-color:var(--garis)}
.kemajuan{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:8px}
.kemajuan .angka{font-family:var(--judul);font-size:3.4rem;font-weight:900;color:var(--hijau);line-height:1}
.kemajuan .angka small{font-size:1.4rem;color:var(--kelabu)}
.kemajuan p{margin:0;max-width:26em;color:var(--kelabu)}

/* ---------- senarai dan carian ---------- */
.alat{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.alat input{flex:1 1 240px;min-height:50px;padding:12px 20px;border:2px solid var(--garis);border-radius:999px;font:inherit;background:#fff;color:var(--hijau)}
.alat button.chip{min-height:46px;padding:8px 18px;border-radius:999px;border:2px solid var(--garis);background:#fff;font:inherit;font-weight:800;color:var(--hijau);cursor:pointer}
.alat button.chip[aria-pressed="true"]{background:var(--hijau);border-color:var(--hijau);color:var(--krim)}
ul.senarai{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.senarai a{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:var(--hijau);background:#fff;border:2px solid var(--mint);border-radius:20px;padding:12px 18px;min-height:60px;font-weight:600}
ul.senarai a:hover{border-color:var(--coral);box-shadow:var(--bayang)}
ul.senarai .no{font-family:var(--judul);font-size:1.7rem;font-weight:900;color:var(--hijau-sederhana)}
@media(max-width:560px){ul.senarai a{grid-template-columns:42px 1fr}ul.senarai .tanda-kumpulan{grid-column:2;justify-content:flex-start}}
.tanda{display:inline-block;font-size:.85rem;font-weight:800;padding:3px 12px;border-radius:999px;white-space:nowrap}
.tanda.done{background:var(--hijau);color:#fff}
.tanda.now{background:var(--coral);color:var(--hijau)}
.tanda.plan{background:var(--kuning);color:var(--hijau)}
.tanda.poster{background:var(--langit);color:#1B4F72}
.tanda-kumpulan{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- halaman hadis ---------- */
a.kembali{display:inline-flex;align-items:center;min-height:44px;margin:26px 0 12px;padding:6px 20px;border-radius:999px;background:var(--mint);color:var(--hijau);font-weight:800;text-decoration:none}
a.kembali:hover{background:var(--kuning)}
.kepala-hadis{background:linear-gradient(135deg,var(--mint) 0%,var(--langit) 100%);border-radius:36px;padding:28px 30px;display:flex;gap:22px;align-items:center;box-shadow:var(--bayang)}
.kepala-hadis .no-lencana{flex:none;width:84px;height:84px;border-radius:50%;background:var(--kuning);display:grid;place-items:center;font-family:var(--judul);font-weight:900;font-size:2.4rem;color:var(--hijau);box-shadow:inset 0 0 0 5px #fff,0 0 0 3px var(--coral)}
.kepala-hadis h1{font-family:var(--judul);font-weight:900;font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.2;margin:.15em 0 0;color:var(--hijau)}
.kepala-hadis .no-besar{font-weight:800;color:var(--kelabu);font-size:1rem}
@media(max-width:560px){.kepala-hadis{flex-direction:column;align-items:flex-start;padding:24px}.kepala-hadis .no-lencana{width:68px;height:68px;font-size:1.9rem}}
.blok{background:#fff;border:2px solid var(--mint);border-radius:26px;padding:24px 28px;margin:20px 0;box-shadow:var(--bayang)}
.blok h3{font-family:var(--judul);font-weight:900;font-size:1.4rem;margin:0 0 .4em;color:var(--hijau)}
.blok p{margin:.4em 0}
.blok.arab-blok{background:#FFFBEA;border:3px solid var(--kuning);border-radius:30px}
.blok.arab-blok .arab{font-size:clamp(1.65rem,3.8vw,2.3rem);margin:0}
.blok.arab-blok .rawi{margin:14px 0 0;font-size:1rem;color:var(--kelabu)}
.blok ul,.blok ol{margin:.3em 0 0;padding-left:1.3em}
.blok li{margin:.4em 0}
.kata-mudah{background:var(--mint);border-color:#BDE3CB}
.nota{background:var(--kuning-lembut);border:2px dashed var(--coral);border-radius:20px;padding:16px 20px;margin:20px 0;font-size:1.02rem}
.aktiviti{border-left:10px solid var(--coral)}
.dua-lajur{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.dua-lajur div{background:var(--langit);border-radius:18px;padding:14px 16px}
.dua-lajur div+div{background:var(--kuning-lembut)}
.dua-lajur b{display:block;color:var(--hijau);font-size:1rem}
@media(max-width:640px){.dua-lajur{grid-template-columns:1fr}}
.nav-hadis{display:flex;justify-content:space-between;gap:10px;margin:28px 0 60px;flex-wrap:wrap}

/* ---------- garis masa ---------- */
.garis-masa{position:relative;margin:26px 0 0;padding-left:38px}
.garis-masa::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:4px;border-radius:4px;background:var(--garis)}
.peristiwa{position:relative;margin:0 0 18px}
.peristiwa::before{content:"";position:absolute;left:-36px;top:22px;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--kuning)}
.peristiwa.done::before{background:var(--hijau);border-color:var(--hijau)}
.peristiwa.now::before{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 5px var(--coral-lembut)}
.peristiwa .blok{margin:0}
.peristiwa .tajuk-kecil{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.peristiwa h3{margin:0}
.fasa-penanda{font-family:var(--judul);font-size:1.5rem;font-weight:900;color:var(--hijau);margin:30px 0 14px -38px;padding-left:38px}

/* ---------- kad ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.grid .blok{margin:0;box-shadow:none;border:0}
.grid .blok:nth-child(4n+1){background:var(--mint)}
.grid .blok:nth-child(4n+2){background:var(--langit)}
.grid .blok:nth-child(4n+3){background:var(--kuning-lembut)}
.grid .blok:nth-child(4n+4){background:var(--coral-lembut)}
.ikon{font-size:2rem;line-height:1;margin-bottom:8px}
.grid-gambar{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:24px}
@media(max-width:700px){.grid-gambar{grid-template-columns:1fr}}
.kad-gambar{background:#fff;border-radius:30px;overflow:hidden;box-shadow:var(--bayang);display:flex;flex-direction:column}
.kad-gambar img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.kad-gambar .teks{padding:20px 24px 24px}
.kad-gambar h3{font-family:var(--judul);font-weight:900;font-size:1.4rem;margin:0 0 .3em}
.kad-gambar p{margin:0 0 .8em}

/* kepala halaman beserta ilustrasi */
.kepala-halaman{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;border-radius:40px;padding:34px 36px;margin-bottom:34px;background:var(--mint)}
.kepala-halaman.langit{background:var(--langit)}
.kepala-halaman.kuning{background:var(--kuning-lembut)}
.kepala-halaman p.sub{margin:0}
.kepala-halaman img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:28px;box-shadow:0 10px 26px rgba(33,78,67,.16);border:5px solid #fff}
@media(max-width:760px){.kepala-halaman{grid-template-columns:1fr;padding:26px 22px}.kepala-halaman img{order:-1;aspect-ratio:16/11}}

/* ---------- hebahan ---------- */
.tag{display:inline-block;font-size:.85rem;font-weight:800;padding:3px 12px;border-radius:999px;background:var(--mint);color:var(--hijau)}
.tag.Notis{background:var(--kuning);color:var(--hijau)}
.tag.Kejayaan{background:var(--coral);color:var(--hijau)}
.tag.IbuBapa{background:var(--langit);color:#1B4F72}
.heb-senarai{display:grid;gap:16px}
.heb{margin:0!important;border:0!important;border-left:10px solid var(--coral)!important}
.heb.auto{border-left-color:#8CCFA8!important}
.heb .meta{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;font-size:1rem;color:var(--kelabu);margin-bottom:6px}
.heb h3{margin-bottom:.2em}
.heb .aksi{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;align-items:center}
.pautan-btn{background:none;border:0;padding:6px 0;min-height:44px;font:inherit;color:var(--hijau-sederhana);text-decoration:underline;cursor:pointer;font-weight:700}
.kosong{text-align:center;padding:34px 20px;color:var(--kelabu);border:3px dashed var(--garis);border-radius:26px;background:#fff}

/* ---------- galeri ---------- */
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.album{display:block;text-decoration:none;color:var(--hijau);background:#fff;border:2px solid var(--mint);border-radius:28px;overflow:hidden;box-shadow:var(--bayang)}
.album:hover{border-color:var(--coral)}
.album .kulit{aspect-ratio:4/3;background:var(--langit);display:grid;place-items:center;position:relative}
.album:nth-child(3n+2) .kulit{background:var(--kuning-lembut)}
.album:nth-child(3n+3) .kulit{background:var(--coral-lembut)}
.album .kulit img{width:100%;height:100%;object-fit:cover;display:block}
.album .kulit .kod-besar{font-family:var(--judul);font-size:2.3rem;font-weight:900;color:var(--hijau-sederhana);opacity:.6}
.album .kulit .bil{position:absolute;right:12px;bottom:12px;background:var(--hijau);color:#fff;font-size:.9rem;font-weight:800;padding:3px 12px;border-radius:999px}
.album .teks{padding:14px 18px 18px}
.album .teks b{display:block;font-family:var(--judul);font-weight:900;font-size:1.2rem;line-height:1.25;color:var(--hijau)}
.album .teks span{font-size:1rem;color:var(--kelabu)}
.album.lalu{opacity:.7}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}
.foto{display:block;width:100%;padding:0;border:2px solid var(--mint);background:#fff;cursor:zoom-in;text-align:left;font:inherit;color:var(--hijau);border-radius:24px;overflow:hidden}
.foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.foto span{display:block;padding:10px 14px 12px;font-size:1rem;color:var(--kelabu)}
dialog#lb{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh;color:#fff;overflow:visible}
dialog#lb::backdrop{background:rgba(23,52,45,.92)}
#lb figure{margin:0;text-align:center}
#lb img{max-width:min(92vw,1100px);max-height:78vh;border-radius:20px;border:4px solid #fff}
#lb figcaption{margin-top:12px;font-size:1.05rem}

.poster-blok{text-align:center}

.kenali{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:40px;align-items:center}
.kenali .poster-besar{margin:0}

/* ---------- ruang guru ---------- */

const now = new Date();
const idxBulan = now.getFullYear() > TAHUN_TAKWIM ? 99 : now.getFullYear() < TAHUN_TAKWIM ? -1 : now.getMonth();
document.title = NAMA_LAMAN + " SK Lotong Tambunan";

function statusAkt(a){ if(a.fasa===1) return "done"; return a.m<idxBulan?"done":(a.m===idxBulan?"now":"plan"); }
const LABEL = {done:"Telah dihayati",now:"Bulan ini",plan:"Akan datang"};
function statusHadis(n){
  const s = AKTIVITI.filter(a=>a.h===n).map(statusAkt);
  if(!s.length) return "";
  if(s.includes("now")) return "now";
  if(s.includes("done")) return "done";
  return "plan";
}
function hadisBulanIni(){
  const sekarang = AKTIVITI.find(a=>statusAkt(a)==="now");
  if(sekarang) return {a:sekarang,label:"Hadis bulan ini ("+BULAN[sekarang.m]+")"};
  const depan = AKTIVITI.find(a=>statusAkt(a)==="plan");
  if(depan) return {a:depan,label:"Hadis seterusnya ("+BULAN[depan.m]+")"};
  return {a:AKTIVITI[AKTIVITI.length-1],label:"Hadis terakhir takwim "+TAHUN_TAKWIM};
}

      <button class="chip" data-f="semua" aria-pressed="${tapisan==='semua'}">Semua</button>
      <button class="chip" data-f="done" aria-pressed="${tapisan==='done'}">Telah dihayati</button>
      <button class="chip" data-f="now" aria-pressed="${tapisan==='now'}">Bulan ini</button>
      <button class="chip" data-f="plan" aria-pressed="${tapisan==='plan'}">Akan datang</button>
      <button class="chip" data-f="poster" aria-pressed="${tapisan==='poster'}">Ada poster</button>
    </div>
    <ul class="senarai" id="senarai"></ul>
  </div></section>`;
}
function isiSenarai(){
  const ul=document.getElementById("senarai"); if(!ul) return;
  const q=carian.trim().toLowerCase();
  let h="";
  for(let i=1;i<=42;i++){
    const st=statusHadis(i);
    if(tapisan==="poster"){ if(!POSTER_ADA.includes(i)) continue; }
    else if(tapisan!=="semua" && st!==tapisan) continue;
    const teks=(TAJUK[i-1]+" "+AKTIVITI.filter(a=>a.h===i).map(a=>a.t+" "+(a.a||"")).join(" ")).toLowerCase();
    if(q && !teks.includes(q) && String(i)!==q) continue;
    h+='<li><a href="#/hadis/'+i+'"><span class="no">'+i+'</span><span>'+esc(TAJUK[i-1])+'</span>'+'<span class="tanda-kumpulan">'+(POSTER_ADA.includes(i)?'<span class="tanda poster">Poster</span>':'')+(st?'<span class="tanda '+st+'">'+LABEL[st]+'</span>':'')+'</span></a></li>';
  }
  ul.innerHTML = h || '<li class="nota">Tiada hadis sepadan. Cuba kata kunci lain atau pilih \u201CSemua\u201D.</li>';
}

function laman_butiran(n){
  if(n<1||n>42) return laman_hadis();
  const k=KANDUNGAN[n], akts=AKTIVITI.filter(a=>a.h===n), st=statusHadis(n);
  let h=`<div class="lapis">
    <a class="kembali" href="#/hadis">Kembali ke senarai hadis</a>
    <div class="kepala-hadis">
      <div class="no-lencana" aria-hidden="true">${n}</div>
      <div><div class="no-besar">Hadis ${n} daripada 42 ${st?' &nbsp;<span class="tanda '+st+'">'+LABEL[st]+'</span>':''}</div>
      <h1>${esc(TAJUK[n-1])}</h1></div>
    </div>`;
  if(POSTER_ADA.includes(n)){
    h+=`<div class="blok poster-blok"><h3>Poster hadis</h3>
      <button class="poster-besar" data-poster="${n}" aria-label="Buka poster Hadis ${n} dalam saiz penuh"><img src="${pPoster(n)}" alt="Poster Hadis ${n}: ${esc(TAJUK[n-1])}" onerror="this.closest('.poster-blok').style.display='none'"></button>
      <div class="aksi-poster noprint">
        <button class="btn gelap kecil" data-poster="${n}">Buka saiz penuh</button>
        <a class="btn kuning kecil" href="${pPoster(n)}" download="poster-hadis-${n}.jpg">Muat turun</a>
        <button class="btn tepi kecil" onclick="cetakPoster()">Cetak poster</button>
      </div></div>`;
  }
  if(k){
    h+=`<div class="blok arab-blok"><h3 style="direction:ltr">Teks hadis</h3><p class="arab" lang="ar">${k.arab}</p><p class="rawi">${esc(k.rawi)}</p></div>
    <div class="blok"><h3>Maksud hadis</h3><p>${esc(k.maksud)}</p></div>
    <div class="blok"><h3>Pengajaran</h3><ul>${k.ajar.map(x=>'<li>'+esc(x)+'</li>').join("")}</ul></div>
    <div class="blok kata-mudah"><h3>Kata mudah untuk murid</h3><p style="font-size:1.15rem;margin:0">${esc(k.mudah)}</p></div>`;
  } else {
    h+=`<div class="nota noprint"><b>Huraian hadis ini sedang disediakan.</b> Teks Arab, maksud dan pengajaran akan ditambah. Sementara itu, rujuk Modul Penghayatan Hadis 40 Imam Nawawi, KPM (Hadis ${n}).</div>`;
  }
  if(akts.length){
    h+=`<h2 class="tajuk" style="margin-top:34px">Di SK Lotong</h2>`;
    akts.forEach(a=>{
      const s=statusAkt(a);
      h+=`<div class="blok aktiviti"><div class="tajuk-kecil"><span class="tanda ${s}">${LABEL[s]}</span><b>${a.k}</b><span>${BULAN[a.m]} ${TAHUN_TAKWIM}</span></div>
        <h3>${esc(a.a||a.t)}</h3><p>${esc(a.f)}</p>
        ${a.p?`<div class="dua-lajur"><div><b>Prasekolah dan Tahun 3</b>${esc(a.p)}</div><div><b>Tahun 4</b>${esc(a.y)}</div></div><p style="margin:12px 0 0;font-size:.95rem;color:var(--kelabu)"><b>Eviden:</b> ${esc(a.e)}</p>`:''}
      </div>`;
    });
  }
  h+=`<div class="nav-hadis">
    ${n>1?'<a class="btn gelap" href="#/hadis/'+(n-1)+'">Hadis '+(n-1)+'</a>':'<span></span>'}
    <button class="btn" onclick="window.print()">Cetak sebagai poster</button>
    ${n<42?'<a class="btn gelap" href="#/hadis/'+(n+1)+'">Hadis '+(n+1)+'</a>':'<span></span>'}
  </div></div>`;
  return h;
}

/* ---------- POSTER ---------- */
const pPoster = n => POSTER_TERTANAM[n] || ("gambar/poster/hadis-"+String(n).padStart(2,"0")+".jpg");
const pPengenalan = () => POSTER_TERTANAM.pengenalan || "gambar/poster/pengenalan.jpg";
const bilPoster = n => ({src:pPoster(n),cap:"Hadis "+n+": "+TAJUK[n-1]});
function cetakPoster(){
  document.body.classList.add("cetak-poster");
  window.addEventListener("afterprint",()=>document.body.classList.remove("cetak-poster"),{once:true});
  window.print();
}

/* ---------- HEBAHAN ---------- */
let hebTapis="Semua";
function tarikhBM(d){return d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear();}
function semuaHebahan(){
  const manual=HEBAHAN.map(h=>({...h,d:new Date(h.tarikh+"T00:00:00"),auto:false}));
  const auto=[]; let rancang=0;
  AKTIVITI.forEach(a=>{
    const s=statusAkt(a);
    if(s==="plan" && rancang++>=1) return;
    auto.push({auto:true,status:s,kategori:"Aktiviti",hadis:a.h,d:new Date(TAHUN_TAKWIM,a.m,1),
      tajuk:"Aktiviti "+BULAN[a.m]+": "+(a.a||a.t),
      isi:"Hadis "+a.h+" ("+a.t+"). "+a.f});
  });
  return manual.concat(auto).sort((x,y)=>y.d-x.d);
}
function teksWA(h){return "*"+h.tajuk+"*\n"+h.isi+"\n\n_Pendidikan Islam SK Lotong, Tambunan_";}
function salin(teks,btn){
  const ok=()=>{if(btn){const t=btn.textContent;btn.textContent="Disalin";setTimeout(()=>btn.textContent=t,1600);}};
  const ta=document.createElement("textarea");ta.value=teks;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");ok();}catch(e){}
  ta.remove();
  if(navigator.clipboard){navigator.clipboard.writeText(teks).then(ok).catch(()=>{});}
}
let _hebSenarai=[];
function kadHebahan(h,i){
  const tk = h.auto ? BULAN[h.d.getMonth()]+" "+h.d.getFullYear() : tarikhBM(h.d);
  const kls = h.kategori.replace(/\s/g,"");
  return `<article class="blok heb ${h.auto?'auto':''}">
    <div class="meta"><span class="tag ${kls}">${esc(h.kategori)}</span>${h.auto?'<span class="tanda '+h.status+'">'+LABEL[h.status]+'</span>':''}<span>${tk}</span></div>
    <h3>${esc(h.tajuk)}</h3><p style="margin:0">${esc(h.isi)}</p>
    <div class="aksi noprint">${h.hadis?'<a href="#/hadis/'+h.hadis+'">Baca hadis ini</a>':''}<button class="pautan-btn" data-wa="${i}">Salin untuk WhatsApp</button></div>
  </article>`;
}
function laman_hebahan(){
  _hebSenarai=semuaHebahan();
  const kat=["Semua","Aktiviti","Notis","Kejayaan","Ibu Bapa"];
  const tapis=_hebSenarai.map((h,i)=>({h,i})).filter(x=>hebTapis==="Semua"||x.h.kategori===hebTapis);
  return `<section class="bhg"><div class="lapis">
    ${tajukHias("Hebahan untuk warga sekolah dan ibu bapa","Berita, notis dan aktiviti Pendidikan Islam SK Lotong. Hebahan boleh disalin terus untuk dikongsi di kumpulan WhatsApp kelas.")}
    <div class="alat noprint" role="group" aria-label="Tapis hebahan">
      ${kat.map(k=>'<button class="chip" data-heb="'+k+'" aria-pressed="'+(hebTapis===k)+'">'+k+'</button>').join("")}
    </div>
    <div class="heb-senarai">${tapis.length?tapis.map(x=>kadHebahan(x.h,x.i)).join(""):'<div class="kosong">Belum ada hebahan dalam kategori ini.</div>'}</div>
  </div></section>`;
}

let _lbSenarai=[], _lbIdx=0;
const albumDari = k => GALERI.filter(g=>g.k===k);

  _lbSenarai=senaraiPoster;

    <div class="poster-grid">
      ${senaraiPoster.map((g,i)=>'<button class="foto" data-lb="'+i+'"><img loading="lazy" src="'+esc(g.src)+'" alt="Poster: '+esc(g.cap)+'" onerror="this.closest(\'.foto\').style.display=\'none\'"><span>'+esc(g.cap)+'</span></button>').join("")}
    </div>
    ${tajukHias("Album aktiviti","Gambar aktiviti Penghayatan Hadis 40 mengikut bulan. Gambar murid hanya dipaparkan dengan kebenaran ibu bapa atau penjaga.")}
    <p style="margin:0 0 18px;color:var(--kelabu)">${jumlah?jumlah+' gambar dalam '+AKTIVITI.filter(x=>albumDari(x.k).length).length+' album.':'Album akan diisi apabila gambar aktiviti ditambah.'}</p>
    <div class="album-grid">
    ${AKTIVITI.map(x=>{
      const fs=albumDari(x.k), s=statusAkt(x);
      return `<a class="album ${s==='plan'?'lalu':''}" href="#/galeri/${x.k}">
        <div class="kulit">${fs.length?'<img loading="lazy" src="'+esc(fs[0].src)+'" alt="">':'<span class="kod-besar">'+x.k+'</span>'}<span class="bil">${fs.length} gambar</span></div>
        <div class="teks"><b>${esc(x.a||x.t)}</b><span>${BULAN[x.m]} ${TAHUN_TAKWIM}, Hadis ${x.h}</span></div></a>`;
    }).join("")}

function bukaLB(i){
  if(!_lbSenarai.length) return;
  _lbIdx=(i+_lbSenarai.length)%_lbSenarai.length;
  const g=_lbSenarai[_lbIdx];
  document.getElementById("lbImg").src=g.src;
  const dl=document.getElementById("lbDl"); dl.href=g.src; dl.setAttribute("download",(g.cap||"gambar").replace(/[^\w\-]+/g,"-")+".jpg");
  document.getElementById("lbImg").alt=g.cap||"Gambar aktiviti";
  document.getElementById("lbCap").textContent=(g.cap||"")+" ("+(_lbIdx+1)+" / "+_lbSenarai.length+")";
  const d=document.getElementById("lb"); if(!d.open) d.showModal();
}

function ikatGuru(){
  const q=id=>document.getElementById(id);
  const kemas=()=>{
    const h={tarikh:q("g-tarikh").value,kategori:q("g-kat").value,tajuk:q("g-tajuk").value.trim()||"(tajuk)",isi:q("g-isi").value.trim()||"(isi hebahan)"};
    q("g-wa").value=teksWA(h);
    q("g-data").value="{tarikh:"+JSON.stringify(h.tarikh)+", kategori:"+JSON.stringify(h.kategori)+", tajuk:"+JSON.stringify(h.tajuk)+", isi:"+JSON.stringify(h.isi)+"},";
  };
  ["g-kat","g-tarikh","g-tajuk","g-isi"].forEach(id=>q(id).addEventListener("input",kemas));
  q("g-salin-wa").addEventListener("click",e=>salin(q("g-wa").value,e.currentTarget));
  q("g-salin-data").addEventListener("click",e=>salin(q("g-data").value,e.currentTarget));
  kemas();
}

/* ---------- ROUTER ---------- */
let RUTE=location.hash||"#/";
function pergi(h){
  if(h==="#/hebahan") hebTapis="Semua";
  if(h==="#/hadis"){tapisan="semua";carian="";}
  RUTE=h;
  try{history.pushState(null,"",h);}catch(e){}
  laluan();
}
function laluan(){
  const p=(RUTE||"#/").replace(/^#\/?/,"").split("/");
  const r=p[0]||"", app=document.getElementById("app");
  let html;
  if(r==="") html=laman_utama();
  else if(r==="hadis") html = p[1]? laman_butiran(parseInt(p[1],10)) : laman_hadis();
  else if(r==="aktiviti") html=laman_aktiviti();
  else if(r==="hebahan") html=laman_hebahan();
  else if(r==="galeri") html=laman_galeri(p[1]);
  else if(r==="guru") html=laman_guru();
  else if(r==="amalan") html=laman_amalan();
  else if(r==="ibubapa") html=laman_ibubapa();
  else html=laman_utama();
  app.innerHTML=html;
  document.querySelectorAll("nav.menu a").forEach(a=>{
    if(a.dataset.r===r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  document.getElementById("menu").classList.remove("buka");
  document.getElementById("btnMenu").setAttribute("aria-expanded","false");
  if(r==="hadis" && !p[1]){
    isiSenarai();
    document.getElementById("cari").addEventListener("input",e=>{carian=e.target.value;isiSenarai();});
    document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
      tapisan=b.dataset.f;
      document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f===tapisan));
      isiSenarai();
    }));
  }
  if(r==="guru") ikatGuru();
  window.scrollTo(0,0);
}
document.getElementById("app").addEventListener("click",e=>{
  const wa=e.target.closest("[data-wa]"); if(wa){salin(teksWA(_hebSenarai[+wa.dataset.wa]),wa);return;}
  const hf=e.target.closest("[data-heb]"); if(hf){hebTapis=hf.dataset.heb;laluan();return;}
  const po=e.target.closest("[data-poster]");
  if(po){const n=+po.dataset.poster; _lbSenarai=[n?bilPoster(n):{src:pPengenalan(),cap:"Jom Kenali Hadis 40 Imam Nawawi"}]; bukaLB(0); return;}
  const lb=e.target.closest("[data-lb]"); if(lb){bukaLB(+lb.dataset.lb);}
});
(function(){
  const d=document.getElementById("lb");
  document.getElementById("lbTutup").addEventListener("click",()=>d.close());
  document.getElementById("lbP").addEventListener("click",()=>bukaLB(_lbIdx-1));
  document.getElementById("lbN").addEventListener("click",()=>bukaLB(_lbIdx+1));
  d.addEventListener("click",e=>{if(e.target===d)d.close();});
  document.addEventListener("keydown",e=>{if(!d.open)return;if(e.key==="ArrowLeft")bukaLB(_lbIdx-1);if(e.key==="ArrowRight")bukaLB(_lbIdx+1);});
})();
document.getElementById("btnMenu").addEventListener("click",e=>{
  const m=document.getElementById("menu"); const o=m.classList.toggle("buka");
  e.currentTarget.setAttribute("aria-expanded",o);
});
/* Pautan dalaman dikendalikan sendiri supaya berfungsi walaupun dalam pratonton (iframe) */
